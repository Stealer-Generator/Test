<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XDS / NOVA V16</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#020202;--border:rgba(255,255,255,.1)}
body{min-height:100vh;color:#fff;background:radial-gradient(circle at 50% -10%,rgba(255,255,255,.08),transparent 35%),radial-gradient(circle at 0% 100%,rgba(255,255,255,.03),transparent 30%),var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:45px 45px}
nav{height:74px;padding:0 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:rgba(0,0,0,.5);backdrop-filter:blur(24px);position:sticky;top:0;z-index:50}
.logo{font-size:15px;font-weight:900;letter-spacing:2px}
.logo span{color:#666}
.discord{color:#999;text-decoration:none;font-size:10px;letter-spacing:1.3px;border:1px solid rgba(255,255,255,.15);padding:9px 14px;border-radius:8px;transition:.25s}
.discord:hover{color:#fff;border-color:rgba(255,255,255,.4)}
main{width:min(860px,94%);margin:auto;padding:60px 0 110px}
.hero{text-align:center;margin-bottom:42px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid rgba(255,255,255,.12);border-radius:100px;color:#777;font-size:9px;letter-spacing:2px;margin-bottom:18px;background:rgba(255,255,255,.02)}
h1{font-size:clamp(42px,8vw,74px);letter-spacing:-4px;line-height:.94;font-weight:900}
h1 span{color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.4)}
.hero p{color:#555;font-size:12px;margin-top:16px}
.hero-help{margin-top:16px;font-size:12px;color:#888;line-height:1.6}
.hero-help a{color:#ccc;text-decoration:underline;text-underline-offset:2px}
.hero-help a:hover{color:#fff}
.panel{padding:28px;border:1px solid var(--border);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.01));box-shadow:0 30px 90px rgba(0,0,0,.65),inset 0 1px rgba(255,255,255,.04);backdrop-filter:blur(28px);animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.section{margin-bottom:22px}
.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.label{font-size:10px;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:1.7px}
.optional{color:#444;font-size:8px;letter-spacing:1px;text-transform:uppercase}
input,textarea{width:100%;border-radius:12px;border:1px solid var(--border);outline:none;background:rgba(0,0,0,.55);color:#fff;padding:0 15px;font-size:12.5px;transition:.25s;font-family:inherit}
input{height:52px}
textarea{padding:13px 15px;resize:vertical;min-height:80px;line-height:1.55}
input::placeholder,textarea::placeholder{color:#444}
input:focus,textarea:focus{border-color:rgba(255,255,255,.35);box-shadow:0 0 0 3px rgba(255,255,255,.04)}

/* Custom slide-down game selector */
.game-drop{position:relative}
.game-btn{width:100%;height:52px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.55);color:#fff;padding:0 15px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.25s;font-family:inherit}
.game-btn:hover,.game-btn.open{border-color:rgba(255,255,255,.35)}
.game-btn span{color:#fff}
.game-btn .arrow{color:#666;font-size:16px;transition:.25s}
.game-btn.open .arrow{transform:rotate(180deg);color:#fff}
.game-list{max-height:0;overflow:hidden;transition:max-height .35s ease;border-radius:0 0 12px 12px;background:#0a0a0a;border:1px solid transparent;border-top:0}
.game-list.open{max-height:220px;border-color:rgba(255,255,255,.15)}
.game-option{padding:14px 16px;font-size:13px;color:#ccc;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06);transition:.2s}
.game-option:last-child{border-bottom:0}
.game-option:hover,.game-option.active{background:rgba(255,255,255,.08);color:#fff}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.tag{display:flex;gap:8px;align-items:center;padding:7px 11px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;font-size:11px;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.remove{border:0;background:none;color:#555;cursor:pointer;font-size:14px;line-height:1}
.remove:hover{color:#fff}
.tag-actions{display:flex;gap:8px;margin-top:10px}
.mini-btn{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#666;background:transparent;border:1px solid rgba(255,255,255,.1);padding:6px 10px;border-radius:6px;cursor:pointer;transition:.2s}
.mini-btn:hover{color:#fff;border-color:rgba(255,255,255,.25)}
.webhook-status{font-size:9px;margin-top:7px;letter-spacing:.5px;height:14px;color:#888}
.visual-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.02);margin-bottom:14px}
.visual-row strong{display:block;font-size:11px;margin-bottom:3px}
.visual-row small{color:#505050;font-size:9px}
.switch{width:42px;height:23px;padding:3px;border-radius:20px;border:1px solid #333;background:#121212;cursor:pointer;transition:.2s}
.switch i{display:block;width:15px;height:15px;border-radius:50%;background:#555;transition:.2s}
.switch.active{background:#eee}
.switch.active i{background:#000;transform:translateX(18px)}
.visual-fields{display:none;margin-top:4px}
.visual-fields.show{display:block}
.discord-join{margin:22px 0 10px;padding:20px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.03);text-align:center;transition:.3s}
.discord-join.highlight{border-color:#fff;box-shadow:0 0 30px rgba(255,255,255,.12)}
.discord-join .big{font-size:14px;font-weight:800;letter-spacing:1px;margin-bottom:10px;color:#fff}
.discord-join a{display:inline-block;margin-top:8px;padding:13px 26px;background:#fff;color:#000;text-decoration:none;border-radius:10px;font-size:12px;font-weight:800;letter-spacing:.8px;transition:.2s}
.discord-join a:hover{background:#ddd;transform:translateY(-1px)}
.discord-join.hidden{display:none}

.generate{width:100%;height:54px;border:0;border-radius:12px;background:#fff;color:#000;font-size:11px;font-weight:900;letter-spacing:1.5px;cursor:pointer;transition:.25s;margin-top:6px}
.generate.locked{background:#151515;color:#555;border:1px solid #222}
.generate:not(.locked):hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(255,255,255,.12)}

/* Big white buttons under Generate */
.big-btns{display:none;gap:10px;margin-top:12px}
.big-btns.show{display:flex}
.big-btn{flex:1;height:54px;border:0;border-radius:12px;background:#fff;color:#000;font-size:11px;font-weight:900;letter-spacing:1px;cursor:pointer;transition:.25s}
.big-btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(255,255,255,.12);background:#eee}

.output{display:none;margin-top:20px;border:1px solid rgba(255,255,255,.1);border-radius:14px;overflow:hidden;background:#050505;animation:fadeUp .35s ease}
.output.show{display:block}
.output-head{height:44px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}
.output-title{color:#666;font-size:9px;letter-spacing:1.4px;text-transform:uppercase}
.output-actions{display:flex;gap:8px}
.copy,.dl{padding:6px 11px;background:transparent;color:#888;border:1px solid rgba(255,255,255,.12);border-radius:6px;cursor:pointer;font-size:8px;letter-spacing:.8px;transition:.2s}
.copy:hover,.dl:hover{color:#fff;border-color:rgba(255,255,255,.3)}
pre{padding:18px;overflow:auto;color:#aaa;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;line-height:1.7;max-height:320px}
.under-btns{display:flex;gap:10px;padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.under-btn{flex:1;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:#ccc;font-size:11px;font-weight:700;letter-spacing:.8px;cursor:pointer;transition:.25s}
.under-btn:hover,.under-btn.active{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
.slide-panel{display:none;background:#080808;border-top:1px solid rgba(255,255,255,.08);padding:22px 18px}
.slide-panel.active{display:block}
.slide-panel h3{font-size:15px;font-weight:800;letter-spacing:1px;margin-bottom:18px;color:#fff}
.step{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.06)}
.step:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.step-num{font-size:10px;font-weight:800;color:#888;letter-spacing:1.4px;margin-bottom:7px;text-transform:uppercase}
.step p{font-size:12.5px;line-height:1.7;color:#999;margin-bottom:6px}
.step a{color:#ccc;text-decoration:underline;text-underline-offset:2px}
.step a:hover{color:#fff}
.step code{background:rgba(255,255,255,.06);padding:2px 6px;border-radius:4px;font-size:11px;color:#ddd}
.warning{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:12px 14px;font-size:12px;color:#bbb;line-height:1.6;margin-top:10px}
.footer-note{text-align:center;margin-top:20px;font-size:11px;color:#555;line-height:1.6}
.footer-note a{color:#aaa}
.game-block{margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.08)}
.game-block:last-child{border-bottom:0;margin-bottom:0}
.game-block h4{font-size:13px;font-weight:800;letter-spacing:1px;margin-bottom:14px;color:#e2e8f0}
.copy-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.copy-row input,.copy-row textarea{flex:1;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.12);color:#ccc;font-size:11.5px;padding:11px 12px;border-radius:8px;font-family:ui-monospace,monospace;resize:none}
.copy-row input{height:42px}
.copy-btn{height:42px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s}
.copy-btn:hover{background:rgba(255,255,255,.12)}
.showcase{margin-top:12px;font-size:12px;color:#999}
.showcase a{color:#ccc;text-decoration:underline}
.coming{text-align:center;padding:30px;color:#666;font-size:14px;font-weight:700;letter-spacing:1px}
footer{text-align:center;margin-top:30px;color:#2a2a2a;font-size:8px;letter-spacing:1.6px}
.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,24px);opacity:0;pointer-events:none;padding:11px 18px;background:#111;border:1px solid #2a2a2a;border-radius:10px;color:#ccc;font-size:11px;transition:.28s cubic-bezier(.2,.8,.2,1);z-index:100;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{font-size:9px;color:#3a3a3a;text-align:center;margin-top:14px}
.dragon-stage{position:fixed;inset:0;z-index:9990;pointer-events:none;overflow:hidden;display:none}
.dragon-stage.active{display:block}
.dragon{position:absolute;left:50%;bottom:-40%;width:340px;height:280px;transform:translateX(-50%) scale(.35);opacity:0;filter:drop-shadow(0 0 25px rgba(255,255,255,.08))}
.dragon svg{width:100%;height:100%;overflow:visible}
.dragon .tail{transform-origin:20px 140px}
.dragon .wing-l{transform-origin:110px 90px}
.dragon .wing-r{transform-origin:170px 90px}
.dragon .jaw{transform-origin:210px 95px}
.dragon.phase-float{animation:dragonFloatIn 2.2s cubic-bezier(.2,.8,.2,1) forwards}
.dragon.phase-float .tail{animation:tailWave 1.6s ease-in-out infinite}
.dragon.phase-float .wing-l{animation:wingFlapL 1.8s ease-in-out infinite}
.dragon.phase-float .wing-r{animation:wingFlapR 1.8s ease-in-out infinite}
.dragon.phase-attack{animation:dragonAttack 1.1s cubic-bezier(.4,0,.2,1) forwards}
.dragon.phase-attack .jaw{animation:jawSnap .4s ease-in-out 2}
.dragon.phase-away{animation:dragonAway 1.4s cubic-bezier(.4,0,.2,1) forwards}
@keyframes dragonFloatIn{0%{opacity:0;transform:translateX(-50%) translateY(80px) scale(.25)}60%{opacity:1}100%{opacity:1;transform:translateX(-50%) translateY(-180px) scale(.55)}}
@keyframes tailWave{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-18deg)}}
@keyframes wingFlapL{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-25deg)}}
@keyframes wingFlapR{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(25deg)}}
@keyframes jawSnap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(18deg)}}
@keyframes dragonAttack{0%{transform:translateX(-50%) translateY(-180px) scale(.55)}40%{transform:translateX(-50%) translateY(-80px) scale(1.35)}70%{transform:translateX(-50%) translateY(-40px) scale(2.1)}100%{transform:translateX(-50%) translateY(20px) scale(2.8);opacity:1}}
@keyframes dragonAway{0%{transform:translateX(-50%) translateY(20px) scale(2.8);opacity:1}100%{transform:translateX(140%) translateY(-220px) scale(.4) rotate(25deg);opacity:0}}
.screen-flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9995;transition:opacity .15s}
.screen-flash.flash{opacity:.18}
@media(max-width:600px){nav{padding:0 5%}main{padding-top:40px}.panel{padding:20px}h1{letter-spacing:-2.5px}.copy-row{flex-direction:column}.copy-btn{width:100%}.dragon{width:240px;height:200px}.big-btns{flex-direction:column}}

/* Minimal updates page */
main{min-height:calc(100vh - 74px);display:flex;align-items:center;justify-content:center;padding:40px 0 90px}
.hero{margin-bottom:0}
.hero-help{font-size:13px;color:#888;line-height:1.8}
.hero-help strong{color:#ccc}
footer{position:fixed;bottom:22px;left:0;right:0;margin:0}

</style>
</head>
<body>
<nav>
    <div class="logo">XDS <span>/ NOVA</span></div>
</nav>

<main>
    <section class="hero">
        <h1>XDS <span>/ NOVA</span></h1>
        <div class="hero-help">
            This website is used for updates.<br>
            Got questions? Reach out to <strong>@06.XD</strong> on DC.<br><br>
            The main website:<br>
            <a href="https://stealer-generator.github.io/dashboard/" target="_blank" rel="noopener">https://stealer-generator.github.io/dashboard/</a>
        </div>
    </section>
</main>

<footer>XDS / NOVA</footer>
</body>
</html>
